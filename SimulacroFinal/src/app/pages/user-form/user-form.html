<section class="container my-3">
  @if (isNew) {
    <h1 class="text-center mb-4">Add new user</h1>
  }
  @else {
    <h1 class="text-center mb-4">Edit user</h1>
  }
  <hr>
  <form [formGroup]="newUserForm" class="card p-3" (ngSubmit)="getDataForm()">

    <div class="my-2">
      <label for="first_name" class="form-label mt-lg-3">First name</label>
      <input type="text" class="form-control" name="first_name" id="first_name" placeholder="first name" formControlName="first_name">
    </div>

    <div class="my-2">
      <label for="last_name" class="form-label mt-lg-3">Last name</label>
      <input type="text" class="form-control" name="last_name" id="last_name" placeholder="last name" formControlName="last_name">
    </div>

    <div class="my-2">
      <label for="username" class="form-label mt-lg-3">Username</label>
      <input type="text" class="form-control" name="username" id="username" placeholder="username" formControlName="username">
    </div>

    <div class="my-2">
      <label for="email" class="form-label mt-lg-3">Email</label>
      <input type="text" class="form-control" name="email" id="email" placeholder="email" formControlName="email">
    </div>

    <div class="my-2">
      <label for="image" class="form-label mt-lg-3">Image</label>
      <input type="text" class="form-control" name="image" id="image" placeholder="Image link" formControlName="image">
    </div>

    <div class="my-2">
      <label for="password" class="form-label mt-lg-3">Password</label>
      <input type="text" class="form-control" name="password" id="password" placeholder="password" formControlName="password">
    </div>

    <h3 class="mt-4 mb-3">Power Stats</h3>
    <div formGroupName="powerStats">
      <div class="row">
        <div class="col-md-6 my-2">
          <label for="intelligence" class="form-label mt-lg-3">Intelligence (0-100)</label>
          <input type="number" class="form-control" name="intelligence" id="intelligence"
                 placeholder="Intelligence" formControlName="intelligence" min="0" max="100">
        </div>

        <div class="col-md-6 my-2">
          <label for="strength" class="form-label mt-lg-3">Strength (0-100)</label>
          <input type="number" class="form-control" name="strength" id="strength"
                 placeholder="Strength" formControlName="strength" min="0" max="100">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 my-2">
          <label for="speed" class="form-label mt-lg-3">Speed (0-100)</label>
          <input type="number" class="form-control" name="speed" id="speed"
                 placeholder="Speed" formControlName="speed" min="0" max="100">
        </div>

        <div class="col-md-6 my-2">
          <label for="durability" class="form-label mt-lg-3">Durability (0-100)</label>
          <input type="number" class="form-control" name="durability" id="durability"
                 placeholder="Durability" formControlName="durability" min="0" max="100">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 my-2">
          <label for="power" class="form-label mt-lg-3">Power (0-100)</label>
          <input type="number" class="form-control" name="power" id="power"
                 placeholder="Power" formControlName="power" min="0" max="100">
        </div>

        <div class="col-md-6 my-2">
          <label for="combat" class="form-label mt-lg-3">Combat (0-100)</label>
          <input type="number" class="form-control" name="combat" id="combat"
                 placeholder="Combat" formControlName="combat" min="0" max="100">
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-center gap-3">
      <button type="submit" value="Save" class="btn btn-success mt-5" [disabled]="!newUserForm.valid && isNew">Save</button>
      <button class="btn btn-secondary mt-5" [routerLink]="['../dashboard']">Cancel</button>
    </div>

  </form>
</section>
