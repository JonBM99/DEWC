<section>
  <div class="d-flex flex-wrap gap-4 justify-content-center">
    @for(product of productsArray; track product.id) {
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3 d-flex">
      <app-product-view [product]="product" (deleted)="onProductDeleted(product.id)"></app-product-view>
      </div>
    }
  </div>
<!-- Controles de paginación -->
  <div class="row my-3">
    <div class="col-12">
      <nav aria-label="Paginación de productos">
        <ul class="pagination pagination-lg justify-content-center flex-wrap gap-1">
          <li class="page-item" [class.disabled]="pageActual === 1">
            <a class="page-link px-2 px-sm-3" (click)="goToPage(1)"
              role="button" tabindex="0" aria-label="Primera página"
              [attr.aria-disabled]="pageActual === 1">
              <i class="bi bi-chevron-double-left"></i>
            </a>
          </li>
          <li class="page-item" [class.disabled]="pageActual === 1">
            <a class="page-link px-2 px-sm-3" (click)="goOneBack()"
              role="button" tabindex="0" aria-label="Página anterior"
              [attr.aria-disabled]="pageActual === 1">
              <i class="bi bi-chevron-left"></i>
            </a>
          </li>
          <li class="page-item" [class.disabled]="pageActual === totalPages">
            <a class="page-link px-2 px-sm-3" (click)="goOneForward()"
              role="button" tabindex="0" aria-label="Página siguiente"
              [attr.aria-disabled]="pageActual === totalPages">
              <i class="bi bi-chevron-right"></i>
            </a>
          </li>
          <li class="page-item" [class.disabled]="pageActual === totalPages">
            <a class="page-link px-2 px-sm-3" (click)="goToPage(totalPages)"
              role="button" tabindex="0" aria-label="Última página"
              [attr.aria-disabled]="pageActual === totalPages">
              <i class="bi bi-chevron-double-right"></i>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</section>
