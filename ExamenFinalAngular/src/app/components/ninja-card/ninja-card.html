<div class="container my-4">
    <div class="card h-100">
        <div class="card-body justify-content-center text-center">
            <img [src]="ninja.image1" class="card-img-top mb-3 rounded mx-auto d-block" alt="Imagen de {{ninja.ninjaname}}" style="width: 130px; height: 130px; object-fit: cover;">
            <h5 class="card-title">{{ninja.fullname}}</h5>
            <p class="card-text">
              <strong>Clan: </strong>{{ninja.clan}}<br>
            </p>
            <p class="card-text">
              <strong>Afiliación:</strong> {{ninja.affiliation}}<br>
            </p>
            <div class="d-flex justify-content-around mt-4">
                <a [routerLink]="['../ninja-view', ninja.id]"><i class="bi bi-search"></i></a>
                <a [routerLink]="['../ninja-form', ninja.id]"><i class="bi bi-pencil-square"></i></a>
                <a (click)="deleteNinja(ninja)" style="cursor: pointer;">
                  <i class="bi bi-trash"></i>
                </a>
            </div>
        </div>
    </div>
</div>
