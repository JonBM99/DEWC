<div class="container-fluid px-3">
  <div class="row my-4">
    <div class="col-12 d-flex justify-content-center">
      <button class="btn" [routerLink]="['../ninja-form']"><strong>Añade un nuevo ninja</strong></button>
    </div>
  </div>
  <div class="row g-3 md-4">
    @for(ninja of arrayNinjas; track ninja.id){
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3 d-flex">
        <app-ninja-card [ninja]="ninja" (ninjaDeleted)="onDeleteNinja($event)" class="w-100"></app-ninja-card>
      </div>
    }
  </div>

  <!-- Controles de paginación -->
  <div class="row my-3">
    <div class="col-12">
      <nav aria-label="Paginación de usuarios">
        <ul class="pagination pagination-lg justify-content-center flex-wrap gap-1">

          <!-- Ir a la anterior -->
          <li class="page-item" [class.disabled]="page === 0">
            <a class="page-link px-2 px-sm-3" (click)="goOneBack()" tabindex="-1"
              [attr.aria-disabled]="page === 0">
              <i class="bi bi-chevron-left"></i>
            </a>
          </li>

          <!-- Ir a la siguiente -->
          <li class="page-item" [class.disabled]="page === total_pages">
            <a class="page-link px-2 px-sm-3" (click)="goOneForward()" tabindex="-1"
              [attr.aria-disabled]="page === total_pages">

              <i class="bi bi-chevron-right"></i>
            </a>
          </li>

        </ul>
      </nav>
    </div>
  </div>
</div>
