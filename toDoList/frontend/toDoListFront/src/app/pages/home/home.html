<div class="todo-container">
  <div class="todo-header">
    <h1>ToDo List</h1>
    <p class="todo-subtitle">Organiza tus tareas diarias</p>
  </div>
  <div class="stats-container">
    <div class="stat-card total">
      <h5>Total</h5>
      <p>{{stats.total}}</p>
    </div>
    <div class="stat-card completed">
      <h5>Completadas</h5>
      <p>{{stats.completed}}</p>
    </div>
    <div class="stat-card pending">
      <h5>Pendientes</h5>
      <p>{{stats.pending}}</p>
    </div>
  </div>
  <form #taskForm="ngForm" (ngSubmit)="addTask()">
    <div class="task-form-card">
      <div class="form-group">
        <label for="title" class="form-label">Título</label>
        <input
          type="text"
          id="title"
          class="form-control"
          name="title"
          [(ngModel)]="newTaskTitle"
          placeholder="Ingresa el título de la tarea"
          required>
      </div>
      <div class="form-group">
        <label for="description" class="form-label">Descripción</label>
        <textarea
          id="description"
          class="form-control"
          name="description"
          [(ngModel)]="newTaskDescription"
          placeholder="Ingresa una descripción detallada"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-add-task">Agregar Tarea</button>
      </div>
    </div>
  </form>
  <div class="tasks-list">
    <ul class="list-group">
      @for (task of tasks; track task.id) {
        <app-task [task]="task" (onDeleted)="loadTasks()" (onToggled)="loadTasks()"></app-task>
      }
    </ul>
  </div>
</div>
